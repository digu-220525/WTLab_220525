<!DOCTYPE html>
<html>
<head>

</head>
<body>
    <p class="change-color">This is the first paragraph.</p>
    <p>This is a paragraph without the specified class.</p>
    <p class="change-color">This is the second paragraph.</p>
    <button onclick="changeColor()">Change Color of Text</button>
<script>
function changeColor() {
    // Select all elements with the class 'change-color'
       var elements = document.querySelectorAll('.change-color');
    // Iterate over each element and change its color to red
       elements.forEach(function(element) {
       element.style.color = 'red';
   });
}
</script>
</body>
</html>
